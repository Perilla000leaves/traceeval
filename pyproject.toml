[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceeval"
version = "0.1.0"
description = "评测 tool-calling agent 的调用轨迹：假成功、未判定、参数漂移、重复调用"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["agent", "evaluation", "llm", "tool-calling", "trajectory", "evals"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# 兼容测试用的可选依赖：使用者不需要装，只有在验证「鸭子类型是否还对得上官方协议」时才装
langchain = ["langchain-core>=0.3"]
adk = ["google-adk>=1.0"]
compat = ["langchain-core>=0.3", "google-adk>=1.0"]

[project.scripts]
traceeval = "traceeval.cli:main"

[tool.setuptools]
packages = ["traceeval"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
